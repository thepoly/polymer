# Home for pnpm settings as of pnpm 10.34 / 11.x. These were previously in
# package.json under "pnpm.overrides", which newer pnpm silently ignores —
# leaving the pinned transitive versions below unenforced on any resolution.
#
# All of these are minimum-version floors for known-vulnerable transitive
# dependencies. Do not drop one without checking why it was pinned.
overrides:
  undici: ^7.24.0
  minimatch: ^10.2.4
  picomatch: ^4.0.4
  flatted: ^3.4.2
  immutable: ^4.3.8
  ajv@^6: ^6.14.0
  ajv@^8: ^8.18.0
  dompurify: ^3.3.2
  file-type: ^21.3.1
  esbuild: ^0.25.0
  yaml@^1: ^1.10.3
  yaml@^2: ^2.8.3
